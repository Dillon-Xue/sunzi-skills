<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0"> <title>SoBooks 搜索验证</title> <style> *{margin:0;padding:0;box-sizing:border-box;} body{display:flex;align-items:center;justify-content:center;height:100vh;background:#f7f7f7;font-family:"Microsoft YaHei","PingFang SC",sans-serif;} .box{text-align:center;padding:50px 60px;background:#fff;border-radius:10px;box-shadow:0 2px 20px rgba(0,0,0,0.08);max-width:420px;width:90%;} .box img{height:60px;margin-bottom:30px;} .box h2{font-size:20px;color:#333;margin-bottom:8px;} .box p{color:#999;font-size:14px;margin-bottom:30px;} .box .q{font-size:34px;color:#e74c3c;font-weight:700;margin-bottom:24px;letter-spacing:4px;} .box form{display:flex;align-items:center;justify-content:center;gap:10px;} .box input[type="text"]{width:100px;padding:10px 12px;font-size:20px;text-align:center;border:2px solid #ddd;border-radius:6px;outline:none;transition:border-color .2s;} .box input[type="text"]:focus{border-color:#e74c3c;} .box button{ padding:10px 28px;font-size:16px;color:#fff;background:#e74c3c;border:none;border-radius:6px;cursor:pointer;transition:background .2s;} .box button:hover{background:#c0392b;} .box .err{color:#e74c3c;font-size:13px;margin-top:14px;display:none;} .box .back{display:block;margin-top:28px;color:#999;font-size:13px;text-decoration:none;} .box .back:hover{color:#e74c3c;} </style> </head> <body> <div class="box"> <h2>SoBooks 搜索验证</h2> <p>请输入计算结果</p> <div class="q">19 + 80 = ?</div> <form method="post" action=""> <input type="text" name="esc_captcha_result" autofocus placeholder="?" required onkeydown="if(event.keyCode===13)this.form.submit()"> <button type="submit">验证</button> </form> <div class="err">答案不正确，请重试</div> <a class="back" href="https://sobooks.cc">← 返回首页</a> </div> </body> </html>
